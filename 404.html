<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | 郭峻瑋</title>
  <style>
    :root {
      --bg-light: #f5f1ed;
      --bg-dark: #2d2416;
      --bg-darker: #1f1815;
      --surface: #ede8e2;
      --text-dark: #2d2416;
      --text-light: #6b6259;
      --text-muted: #9a8f85;
      --text-white: #ffffff;
      --border-light: rgba(45, 36, 22, 0.1);
      --border-medium: rgba(45, 36, 22, 0.15);
      --border-dark: rgba(45, 36, 22, 0.25);
      --accent: #8b7355;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-light);
      color: var(--text-dark);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .code { font-size: 6rem; font-weight: 800; color: var(--accent); line-height: 1; }
    h1 { font-size: 1.5rem; margin: 16px 0 8px; }
    p { color: var(--text-light); margin-bottom: 32px; }
    a {
      display: inline-block;
      padding: 12px 28px;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: var(--bg-dark); }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>頁面不存在</h1>
  <p>你找的這個頁面不在這裡。</p>
  <a href="/personal-portfolio/">← 回首頁</a>
</body>
</html>
