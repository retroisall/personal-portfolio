<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | 郭峻瑋</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --accent: #e94560;
      --text: #e0e0e0;
      --muted: #a0a0b0;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .code { font-size: 6rem; font-weight: 800; color: var(--accent); line-height: 1; }
    h1 { font-size: 1.5rem; margin: 16px 0 8px; }
    p { color: var(--muted); margin-bottom: 32px; }
    a {
      display: inline-block;
      padding: 12px 28px;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #c73652; }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>頁面不存在</h1>
  <p>你找的這個頁面不在這裡。</p>
  <a href="/">← 回首頁</a>
</body>
</html>
